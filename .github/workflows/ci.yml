name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - run: npm install

      - run: npm test

      - run: npm run build

      - name: Check the npm package contains no secrets or local junk
        run: |
          npm pack --dry-run --json --ignore-scripts > pack.json
          node -e "
            const files = require('./pack.json')[0].files.map((f) => f.path);
            const bad = files.filter((p) => /(^|\/)\.env$|node_modules|artifacts\/|playwright-report|test-results|\.cache\//.test(p));
            if (bad.length) { console.error('Refusing to publish:', bad); process.exit(1); }
            console.log('npm package OK:', files.length, 'files');
          "
          if npm pack --ignore-scripts --pack-destination "$RUNNER_TEMP" >/dev/null && tar -xzOf "$RUNNER_TEMP"/qa-intelligence-*.tgz | grep -E 'sk-ant-[A-Za-z0-9_-]{20,}|sk-[A-Za-z0-9]{32,}'; then
            echo 'Refusing to publish: something that looks like an API key is in the package'; exit 1
          fi

      - name: Smoke test diff CLI against fixtures
        run: |
          node dist/cli/diff.js \
            --baseline fixtures/baseline-artifacts \
            --current fixtures/current-artifacts \
            --out failure-diff.json \
            --fail-on-blocking false
          node -e "
            const d = require('./failure-diff.json');
            if (d.newFailures.length !== 2) throw new Error('expected 2 new failures');
            if (d.unchangedFailures.length !== 1) throw new Error('expected 1 unchanged failure');
            if (d.fixedFailures.length !== 1) throw new Error('expected 1 fixed failure');
            if (d.blockingFailures.length !== 1) throw new Error('expected 1 blocking failure');
          "

      - name: Smoke test release guardian CLI against fixtures
        run: |
          node dist/cli/guardian.js analyze \
            --diff failure-diff.json \
            --current fixtures/current-artifacts \
            --fail-on never
          node -e "
            const { report } = require('./release-report.json');
            if (report.decision !== 'BLOCK') throw new Error('expected BLOCK, got ' + report.decision);
            if (report.counts.regression !== 1) throw new Error('expected 1 regression');
            if (report.counts.flaky !== 1) throw new Error('expected 1 flaky');
            if (report.preExistingCount !== 1) throw new Error('expected 1 pre-existing');
          "
          if node dist/cli/guardian.js analyze --diff failure-diff.json --current fixtures/current-artifacts --fail-on review > /dev/null; then
            echo "expected exit 1 for BLOCK with --fail-on review"; exit 1
          fi
