name: QA Intelligence CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read
  actions: read
  issues: write
  pull-requests: write

concurrency:
  group: qa-intelligence-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      HAS_AI_KEY: ${{ secrets.OPENAI_API_KEY != '' && 'true' || 'false' }}
    defaults:
      run:
        working-directory: playwright

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: playwright/package-lock.json

      - name: Install dependencies
        run: npm install

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run Playwright tests
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          AI_ANALYSIS: ${{ env.HAS_AI_KEY }}
          BASE_URL: https://your-app.example.com
          HEADLESS: true
          PW_WORKERS: 2
          PW_RETRIES: 1
          TEST_USERNAME: ${{ secrets.TEST_USERNAME }}
          TEST_PASSWORD: ${{ secrets.TEST_PASSWORD }}
        run: npx playwright test

      - name: Upload Playwright HTML report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: playwright-report-${{ github.run_id }}
          path: playwright/playwright-report/
          retention-days: 14

      - name: Upload failure artifacts
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: playwright-artifacts-${{ github.run_id }}
          path: playwright/artifacts/
          retention-days: 14
          if-no-files-found: ignore

      - name: Upload baseline artifacts (default branch)
        if: always() && github.event_name == 'push'
        uses: actions/upload-artifact@v6
        with:
          name: playwright-artifacts-baseline
          path: playwright/artifacts/
          retention-days: 30
          if-no-files-found: ignore

      - name: Download baseline artifacts from default branch
        id: download-baseline
        if: always() && github.event_name == 'pull_request'
        uses: dawidd6/action-download-artifact@v21
        with:
          workflow: qa-intelligence.yml
          branch: ${{ github.base_ref }}
          name: playwright-artifacts-baseline
          path: baseline-artifacts
          if_no_artifact_found: ignore

      - name: Check baseline artifact
        id: baseline
        if: always() && github.event_name == 'pull_request'
        working-directory: .
        run: |
          if find baseline-artifacts -type f -print -quit 2>/dev/null | grep -q .; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "No baseline yet — expected until this workflow merges and runs on push to the default branch."
          fi

      - name: Restore failure history cache
        if: always() && github.event_name == 'pull_request' && steps.baseline.outputs.available == 'true'
        uses: actions/cache@v4
        with:
          path: playwright/.cache
          # Repo-scoped key so recurrence + Flaky Watchlist persist across PR runs.
          # Do not include github.sha — that creates a new cache entry every commit.
          key: failure-history-${{ github.repository }}

      - name: Compute failure diff
        if: always() && github.event_name == 'pull_request' && steps.baseline.outputs.available == 'true'
        run: npx qa-intelligence-diff --baseline ../baseline-artifacts --current artifacts

      - name: Update failure history (recurrence)
        if: always() && github.event_name == 'pull_request' && steps.baseline.outputs.available == 'true'
        run: npx qa-intelligence-history

      - name: Comment PR with failure summary
        if: always() && github.event_name == 'pull_request' && steps.baseline.outputs.available == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          npx qa-intelligence-comment \
            --diff failure-diff.json \
            --repo ${{ github.repository }} \
            --pr ${{ github.event.pull_request.number }} \
            --token "$GITHUB_TOKEN"
