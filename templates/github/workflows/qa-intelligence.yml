name: AI Release Guardian

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read
  actions: read
  issues: write
  pull-requests: write

concurrency:
  group: qa-intelligence-${{ github.workflow }}-${{ github.ref }}
  # Only cancel superseded PR runs. Never cancel a push/merge run mid-flight  - 
  # if a test's cleanup (e.g. restoring a shared fixture in a `finally`) gets
  # killed, it can leave shared test data corrupted for every run after it.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      # AI analysis is optional. Set OPENAI_API_KEY or ANTHROPIC_API_KEY as a repo secret
      # (provider is picked from whichever key exists, or set AI_PROVIDER as a repo variable).
      HAS_AI_KEY: ${{ (secrets.OPENAI_API_KEY != '' || secrets.ANTHROPIC_API_KEY != '') && 'true' || 'false' }}
      # PR head commit, so file links in the guardian comment point at the PR's code.
      RELEASE_GUARDIAN_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
    defaults:
      run:
        working-directory: playwright

    steps:
      - uses: actions/checkout@v6
        with:
          # Full history so the guardian can see which files/commits the PR changed.
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: playwright/package-lock.json

      - name: Install dependencies
        run: npm install

      # --- Merge-time reuse: avoid re-running the full suite on every merge ---
      # On push (merge to main/master), the PR that just merged already ran
      # this same suite. Reuse its results as this run's baseline candidate
      # instead of paying for a second full Playwright run.

      - name: Find source PR for this merge
        id: source-pr
        if: github.event_name == 'push'
        continue-on-error: true
        working-directory: .
        run: |
          PR_HEAD_SHA=$(curl -s -H "Authorization: Bearer ${{ github.token }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/commits/${{ github.sha }}/pulls" \
            | jq -r '.[0].head.sha // empty')

          if [ -z "$PR_HEAD_SHA" ]; then
            echo "No PR found for this merge commit - will run fresh instead."
            exit 0
          fi

          RUN_ID=$(curl -s -H "Authorization: Bearer ${{ github.token }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/qa-intelligence.yml/runs?head_sha=$PR_HEAD_SHA&event=pull_request&status=completed&per_page=1" \
            | jq -r '.workflow_runs[0].id // empty')

          if [ -z "$RUN_ID" ]; then
            echo "PR found but it has no completed run - will run fresh instead."
            exit 0
          fi

          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"
          echo "Found source PR's run: $RUN_ID"

      - name: Try to reuse the source PR's results
        if: github.event_name == 'push' && steps.source-pr.outputs.run_id != ''
        continue-on-error: true
        uses: dawidd6/action-download-artifact@v21
        with:
          run_id: ${{ steps.source-pr.outputs.run_id }}
          # Must match the PR run's "Upload failure artifacts" name below.
          name: playwright-artifacts-${{ steps.source-pr.outputs.run_id }}
          path: reused-artifacts
          if_no_artifact_found: ignore

      - name: Check what got reused
        id: reused
        if: always() && github.event_name == 'push'
        working-directory: .
        run: |
          if find reused-artifacts -type f -print -quit 2>/dev/null | grep -q .; then
            echo "reused=true" >> "$GITHUB_OUTPUT"
          else
            echo "reused=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install Playwright browsers
        if: github.event_name == 'pull_request' || steps.reused.outputs.reused != 'true'
        run: npx playwright install --with-deps chromium

      - name: Run Playwright tests
        if: github.event_name == 'pull_request' || steps.reused.outputs.reused != 'true'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          AI_PROVIDER: ${{ vars.AI_PROVIDER }}
          AI_MODEL: ${{ vars.AI_MODEL }}
          AI_ANALYSIS: ${{ env.HAS_AI_KEY }}
          BASE_URL: https://your-app.example.com
          HEADLESS: true
          PW_WORKERS: 2
          PW_RETRIES: 1
          TEST_USERNAME: ${{ secrets.TEST_USERNAME }}
          TEST_PASSWORD: ${{ secrets.TEST_PASSWORD }}
        run: npx playwright test

      - name: Record a baseline even when everything passes
        if: always() && github.event_name == 'pull_request'
        run: |
          mkdir -p artifacts
          # A fully green run leaves `artifacts/` empty, and the upload step
          # below skips empty directories - so a clean PR would never
          # produce anything for a later merge to reuse. This marker
          # guarantees an artifact always exists, recording "zero failures"
          # as a real, reusable baseline. Must NOT be a dotfile: upload's
          # hidden-file handling would filter it back out.
          touch artifacts/baseline-marker.txt

      - name: Merge reused results into this run
        if: always() && github.event_name == 'push' && steps.reused.outputs.reused == 'true'
        working-directory: .
        run: |
          mkdir -p playwright/artifacts
          cp -r reused-artifacts/. playwright/artifacts/
          echo "Reused the source PR's results instead of re-running Playwright."

      - name: Upload Playwright HTML report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: playwright-report-${{ github.run_id }}
          path: playwright/playwright-report/
          retention-days: 14
          if-no-files-found: ignore

      - name: Upload failure artifacts
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: playwright-artifacts-${{ github.run_id }}
          path: playwright/artifacts/
          retention-days: 14
          if-no-files-found: ignore

      - name: Upload baseline artifacts (default branch)
        if: always() && github.event_name == 'push'
        uses: actions/upload-artifact@v6
        with:
          name: playwright-artifacts-baseline
          path: playwright/artifacts/
          retention-days: 30
          if-no-files-found: ignore

      - name: Download baseline artifacts from default branch
        id: download-baseline
        if: always() && github.event_name == 'pull_request'
        uses: dawidd6/action-download-artifact@v21
        with:
          workflow: qa-intelligence.yml
          branch: ${{ github.base_ref }}
          name: playwright-artifacts-baseline
          path: baseline-artifacts
          if_no_artifact_found: ignore

      - name: Check baseline artifact
        id: baseline
        if: always() && github.event_name == 'pull_request'
        working-directory: .
        run: |
          if find baseline-artifacts -type f -print -quit 2>/dev/null | grep -q .; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "No baseline yet - expected until this workflow merges and runs on push to the default branch."
          fi

      # --- AI Release Guardian -------------------------------------------------
      # Works with or without an AI key: without one, failures are classified
      # from Playwright's error output; with one, AI analysis adds evidence.

      - name: Compute failure diff
        if: always() && github.event_name == 'pull_request' && steps.baseline.outputs.available == 'true'
        # The guardian step below owns the merge gate.
        run: npx qa-intelligence-diff --baseline ../baseline-artifacts --current artifacts --fail-on-blocking false

      - name: Restore failure history cache
        if: always() && github.event_name == 'pull_request' && steps.baseline.outputs.available == 'true'
        uses: actions/cache@v4
        with:
          path: playwright/.cache
          # A key that never changes (e.g. just the repo name) restores fine
          # across commits, but actions/cache also skips SAVING once a run
          # gets an exact hit on the primary key - so a permanently-stable
          # key still stops accumulating after its very first save. A
          # per-run key + prefix restore-keys avoids both failure modes:
          # every run saves under a fresh key (so saving never gets
          # skipped), while the prefix still restores the latest match.
          key: failure-history-${{ github.repository }}-${{ github.run_id }}
          restore-keys: |
            failure-history-${{ github.repository }}-

      - name: Update failure history (recurrence)
        if: always() && github.event_name == 'pull_request' && steps.baseline.outputs.available == 'true'
        run: npx qa-intelligence-history

      - name: Assess release risk
        id: guardian
        if: always() && github.event_name == 'pull_request' && steps.baseline.outputs.available == 'true'
        # --fail-on review: fail the job on BLOCK or REVIEW REQUIRED (recommended).
        #           block:  fail only on BLOCK.   never: report only.
        # With an AI key set, one extra call reads the failing tests + the PR diff and names the
        # change that broke them (--ai auto). Without a key this step is fully deterministic.
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          AI_PROVIDER: ${{ vars.AI_PROVIDER }}
          AI_MODEL: ${{ vars.AI_MODEL }}
        run: |
          npx ai-release-guardian analyze \
            --current artifacts \
            --base "${{ github.event.pull_request.base.sha }}" \
            --fail-on review

      - name: Write job summary
        if: always() && github.event_name == 'pull_request' && steps.baseline.outputs.available == 'true'
        run: if [ -f release-guardian.md ]; then cat release-guardian.md >> "$GITHUB_STEP_SUMMARY"; fi

      - name: Comment PR with release assessment
        if: always() && github.event_name == 'pull_request' && steps.baseline.outputs.available == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          if [ -f release-report.json ]; then
            npx ai-release-guardian comment \
              --report release-report.json \
              --repo "${{ github.repository }}" \
              --pr "${{ github.event.pull_request.number }}"
          fi

      - name: Upload release report
        if: always() && github.event_name == 'pull_request' && steps.baseline.outputs.available == 'true'
        uses: actions/upload-artifact@v6
        with:
          name: release-guardian-${{ github.run_id }}
          path: |
            playwright/release-report.json
            playwright/release-guardian.md
          retention-days: 14
          if-no-files-found: ignore
